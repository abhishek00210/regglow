<svg width="1120" height="820" viewBox="0 0 1120 820" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">RegFlow AI dossier workflow visual</title>
  <desc id="desc">A regulatory dossier automation interface with CTD modules, gap checks, country localization, and publishing status.</desc>
  <defs>
    <linearGradient id="panel" x1="72" y1="56" x2="1048" y2="764" gradientUnits="userSpaceOnUse">
      <stop stop-color="#253529"/>
      <stop offset="1" stop-color="#0F1511"/>
    </linearGradient>
    <linearGradient id="glow" x1="164" y1="80" x2="914" y2="739" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38D6A5" stop-opacity=".38"/>
      <stop offset=".55" stop-color="#F2B45C" stop-opacity=".17"/>
      <stop offset="1" stop-color="#FF725E" stop-opacity=".16"/>
    </linearGradient>
    <filter id="softShadow" x="-8%" y="-8%" width="116%" height="116%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="34" stdDeviation="34" flood-color="#000000" flood-opacity=".38"/>
    </filter>
    <filter id="blurGlow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="42"/>
    </filter>
  </defs>

  <rect width="1120" height="820" rx="38" fill="url(#glow)" filter="url(#blurGlow)" opacity=".55"/>
  <rect x="54" y="46" width="1012" height="728" rx="34" fill="url(#panel)" stroke="#F6F4ED" stroke-opacity=".12" filter="url(#softShadow)"/>
  <rect x="84" y="76" width="952" height="668" rx="24" fill="#121A14" stroke="#F6F4ED" stroke-opacity=".1"/>

  <g opacity=".9">
    <circle cx="126" cy="114" r="7" fill="#FF725E"/>
    <circle cx="150" cy="114" r="7" fill="#F2B45C"/>
    <circle cx="174" cy="114" r="7" fill="#38D6A5"/>
    <rect x="234" y="103" width="232" height="22" rx="11" fill="#F6F4ED" fill-opacity=".1"/>
    <rect x="878" y="98" width="112" height="32" rx="8" fill="#38D6A5"/>
    <text x="911" y="119" fill="#08110C" font-family="Arial, sans-serif" font-size="13" font-weight="700">Export</text>
  </g>

  <line x1="84" y1="154" x2="1036" y2="154" stroke="#F6F4ED" stroke-opacity=".1"/>

  <g>
    <rect x="116" y="188" width="226" height="520" rx="18" fill="#0E130F" stroke="#F6F4ED" stroke-opacity=".1"/>
    <text x="142" y="226" fill="#F6F4ED" font-family="Arial, sans-serif" font-size="19" font-weight="700">Dossier map</text>
    <text x="142" y="253" fill="#B9B7AA" font-family="Arial, sans-serif" font-size="13">ROW CTD / ACTD structure</text>

    <g font-family="Arial, sans-serif" font-size="14" font-weight="700">
      <rect x="138" y="296" width="180" height="44" rx="10" fill="#38D6A5" fill-opacity=".18" stroke="#38D6A5" stroke-opacity=".52"/>
      <text x="158" y="324" fill="#DFFCF3">Module 1</text>
      <rect x="138" y="358" width="180" height="44" rx="10" fill="#F6F4ED" fill-opacity=".07" stroke="#F6F4ED" stroke-opacity=".1"/>
      <text x="158" y="386" fill="#E8E2D4">Module 2</text>
      <rect x="138" y="420" width="180" height="44" rx="10" fill="#F2B45C" fill-opacity=".16" stroke="#F2B45C" stroke-opacity=".44"/>
      <text x="158" y="448" fill="#FFE2B2">Module 3</text>
      <rect x="138" y="482" width="180" height="44" rx="10" fill="#F6F4ED" fill-opacity=".06" stroke="#F6F4ED" stroke-opacity=".1"/>
      <text x="158" y="510" fill="#E8E2D4">Module 4</text>
      <rect x="138" y="544" width="180" height="44" rx="10" fill="#F6F4ED" fill-opacity=".06" stroke="#F6F4ED" stroke-opacity=".1"/>
      <text x="158" y="572" fill="#E8E2D4">Module 5</text>
    </g>

    <rect x="138" y="632" width="82" height="28" rx="7" fill="#38D6A5"/>
    <text x="157" y="651" fill="#08110C" font-family="Arial, sans-serif" font-size="12" font-weight="700">Ready</text>
    <rect x="230" y="632" width="88" height="28" rx="7" fill="#FF725E" fill-opacity=".18"/>
    <text x="250" y="651" fill="#FFB3A7" font-family="Arial, sans-serif" font-size="12" font-weight="700">3 gaps</text>
  </g>

  <g>
    <rect x="374" y="188" width="374" height="520" rx="18" fill="#151F17" stroke="#F6F4ED" stroke-opacity=".1"/>
    <text x="404" y="226" fill="#F6F4ED" font-family="Arial, sans-serif" font-size="19" font-weight="700">AI regulatory workspace</text>
    <text x="404" y="253" fill="#B9B7AA" font-family="Arial, sans-serif" font-size="13">Source documents checked against country logic</text>

    <rect x="404" y="292" width="314" height="118" rx="14" fill="#F6F4ED" fill-opacity=".06" stroke="#F6F4ED" stroke-opacity=".1"/>
    <text x="428" y="324" fill="#38D6A5" font-family="Arial, sans-serif" font-size="13" font-weight="700">COUNTRY ADAPTATION</text>
    <text x="428" y="356" fill="#F6F4ED" font-family="Arial, sans-serif" font-size="23" font-weight="700">Kenya Module 1</text>
    <rect x="428" y="374" width="168" height="10" rx="5" fill="#F6F4ED" fill-opacity=".18"/>
    <rect x="428" y="390" width="232" height="10" rx="5" fill="#F6F4ED" fill-opacity=".12"/>

    <rect x="404" y="436" width="150" height="116" rx="14" fill="#38D6A5" fill-opacity=".12" stroke="#38D6A5" stroke-opacity=".25"/>
    <text x="428" y="470" fill="#DFFCF3" font-family="Arial, sans-serif" font-size="14" font-weight="700">Formatting</text>
    <text x="428" y="508" fill="#F6F4ED" font-family="Arial, sans-serif" font-size="33" font-weight="700">92%</text>
    <text x="428" y="530" fill="#B9B7AA" font-family="Arial, sans-serif" font-size="12">auto matched</text>

    <rect x="568" y="436" width="150" height="116" rx="14" fill="#F2B45C" fill-opacity=".12" stroke="#F2B45C" stroke-opacity=".25"/>
    <text x="592" y="470" fill="#FFE2B2" font-family="Arial, sans-serif" font-size="14" font-weight="700">Gap check</text>
    <text x="592" y="508" fill="#F6F4ED" font-family="Arial, sans-serif" font-size="33" font-weight="700">07</text>
    <text x="592" y="530" fill="#B9B7AA" font-family="Arial, sans-serif" font-size="12">items flagged</text>

    <rect x="404" y="578" width="314" height="78" rx="14" fill="#0E130F" stroke="#F6F4ED" stroke-opacity=".1"/>
    <circle cx="436" cy="617" r="16" fill="#38D6A5"/>
    <path d="M429 617.5L434.5 623L444 611" stroke="#08110C" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="466" y="613" fill="#F6F4ED" font-family="Arial, sans-serif" font-size="15" font-weight="700">eCTD-ready folder logic</text>
    <text x="466" y="635" fill="#B9B7AA" font-family="Arial, sans-serif" font-size="12">Export path prepared for publishing review</text>
  </g>

  <g>
    <rect x="780" y="188" width="226" height="520" rx="18" fill="#0E130F" stroke="#F6F4ED" stroke-opacity=".1"/>
    <text x="808" y="226" fill="#F6F4ED" font-family="Arial, sans-serif" font-size="19" font-weight="700">Submission value</text>
    <text x="808" y="253" fill="#B9B7AA" font-family="Arial, sans-serif" font-size="13">Manual cost avoided</text>

    <g transform="translate(808 304)">
      <circle cx="84" cy="84" r="74" fill="none" stroke="#F6F4ED" stroke-opacity=".09" stroke-width="18"/>
      <path d="M84 10A74 74 0 1 1 27.2 130.9" stroke="#38D6A5" stroke-width="18" stroke-linecap="round"/>
      <text x="39" y="78" fill="#F6F4ED" font-family="Arial, sans-serif" font-size="34" font-weight="700">80%</text>
      <text x="42" y="104" fill="#B9B7AA" font-family="Arial, sans-serif" font-size="12">manual work</text>
    </g>

    <rect x="808" y="504" width="170" height="1" fill="#F6F4ED" fill-opacity=".12"/>
    <text x="808" y="544" fill="#B9B7AA" font-family="Arial, sans-serif" font-size="13">Service replaced</text>
    <text x="808" y="580" fill="#F2B45C" font-family="Arial, sans-serif" font-size="28" font-weight="700">Rs. 1-3L</text>
    <text x="808" y="622" fill="#B9B7AA" font-family="Arial, sans-serif" font-size="13">AI pilot target</text>
    <text x="808" y="658" fill="#38D6A5" font-family="Arial, sans-serif" font-size="28" font-weight="700">Rs. 50k</text>
  </g>
</svg>
